[pytest]
# The repo root holds shared/, services/, orchestration/ and workers/; the FastAPI app
# lives in backend/ and imports itself as `app.*`, exactly as uvicorn runs it.
pythonpath = . backend
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not live"
markers =
    live: real network calls to model providers (run with -m live and credentials)
filterwarnings =
    ignore:Core Pydantic V1 functionality:UserWarning
